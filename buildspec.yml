version: 0.2

env:
  variables:
    ImageName: order-service

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 828776174978.dkr.ecr.ap-southeast-2.amazonaws.com

  build:
    commands:
      - echo "Building Maven project"
      - ./mvnw clean package -DskipTests
      - ls -la target
      - docker build -t $ImageName .

  post_build:
    commands:
      - docker tag $ImageName:latest 828776174978.dkr.ecr.ap-southeast-2.amazonaws.com/$ImageName:latest
      - docker push 828776174978.dkr.ecr.ap-southeast-2.amazonaws.com/$ImageName:latest